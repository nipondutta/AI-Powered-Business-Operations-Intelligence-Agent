services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  ui:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on: [api]
